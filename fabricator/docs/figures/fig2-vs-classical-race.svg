<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="1100" height="640" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#111">Figure 2 — A classical TOCTOU race compared with the agent read-path race</text>
<text x="20" y="48" fill="#555">Both follow a check–gap–use pattern. In the agent case, an adversary exploits the gap and speed discourages verification.</text>
<!-- LEFT panel -->
<text x="20" y="82" font-weight="bold" font-size="15" fill="#111">Classical race: two threads and one file</text>
<g fill="#111" font-weight="bold"><text x="20" y="130">Thread A</text><text x="20" y="200">Thread B</text><text x="20" y="270">File</text></g>
<rect x="100" y="110" width="110" height="34" rx="6" fill="#dbe8fb" stroke="#3b6fc4"/><text x="155" y="132" text-anchor="middle">check: is it safe?</text>
<rect x="210" y="110" width="150" height="34" fill="#f2f2f2" stroke="#ddd"/><text x="285" y="132" text-anchor="middle" fill="#666">gap (scheduler)</text>
<rect x="360" y="110" width="110" height="34" rx="6" fill="#f8d6d6" stroke="#c0392b"/><text x="415" y="132" text-anchor="middle">use file</text>
<rect x="235" y="180" width="110" height="34" rx="6" fill="#fde9c8" stroke="#d68910"/><text x="290" y="202" text-anchor="middle">swap file</text>
<rect x="100" y="250" width="135" height="34" rx="6" fill="#d5f0dd" stroke="#1e8449"/><text x="167" y="272" text-anchor="middle">benign</text>
<rect x="235" y="250" width="235" height="34" rx="6" fill="#f8d6d6" stroke="#c0392b"/><text x="352" y="272" text-anchor="middle">malicious (from swap on)</text>
<path d="M290 180 L290 145" stroke="#333" marker-end="url(#a)"/>
<line x1="100" y1="310" x2="490" y2="310" stroke="#111" stroke-width="2" marker-end="url(#a)"/><text x="495" y="314" fill="#111">time</text>
<text x="20" y="335" fill="#555">Cause: unsynchronized access, usually an accidental bug (CWE-367).</text>
<!-- RIGHT panel -->
<text x="580" y="82" font-weight="bold" font-size="15" fill="#111">Agent race: the read path</text>
<g fill="#111" font-weight="bold"><text x="580" y="130">Agent</text><text x="580" y="200">Attacker</text><text x="580" y="270">Content</text></g>
<rect x="660" y="110" width="110" height="34" rx="6" fill="#dbe8fb" stroke="#3b6fc4"/><text x="715" y="132" text-anchor="middle">read: looks safe</text>
<rect x="770" y="110" width="150" height="34" fill="#f2f2f2" stroke="#ddd"/><text x="845" y="132" text-anchor="middle" fill="#666">gap (think time δ)</text>
<rect x="920" y="110" width="110" height="34" rx="6" fill="#f8d6d6" stroke="#c0392b"/><text x="975" y="132" text-anchor="middle">acts on it</text>
<rect x="780" y="180" width="130" height="34" rx="6" fill="#fde9c8" stroke="#d68910"/><text x="845" y="196" text-anchor="middle">predict and prefetch</text><text x="845" y="209" text-anchor="middle" font-size="11">or replace content</text>
<rect x="660" y="250" width="135" height="34" rx="6" fill="#d5f0dd" stroke="#1e8449"/><text x="727" y="272" text-anchor="middle">plausible</text>
<rect x="795" y="250" width="235" height="34" rx="6" fill="#f8d6d6" stroke="#c0392b"/><text x="912" y="272" text-anchor="middle">attacker-chosen content</text>
<path d="M845 180 L845 145" stroke="#333" marker-end="url(#a)"/>
<line x1="660" y1="310" x2="1050" y2="310" stroke="#111" stroke-width="2" marker-end="url(#a)"/><text x="1055" y="314" fill="#111">time</text>
<text x="580" y="335" fill="#555">Cause: deliberate timing combined with skipped verification.</text>
<line x1="550" y1="70" x2="550" y2="345" stroke="#ccc" stroke-dasharray="4"/>
<!-- mapping table -->
<text x="20" y="378" font-weight="bold" font-size="15" fill="#111">Mapping the analogy—and its limits</text>
<g stroke="#bbb" fill="none"><rect x="20" y="390" width="1060" height="215"/><line x1="360" y1="390" x2="360" y2="605"/><line x1="720" y1="390" x2="720" y2="605"/></g>
<rect x="20" y="390" width="1060" height="30" fill="#f0f0f0"/>
<g font-weight="bold" fill="#111"><text x="30" y="410">Classical race</text><text x="370" y="410">Agent read-path race</text><text x="730" y="410">Difference</text></g>
<g fill="#222">
<text x="30" y="443">threads A and B</text><text x="370" y="443">agent and attacker server</text><text x="730" y="443">only one party is honest</text>
<text x="30" y="473">shared resource</text><text x="370" y="473">agent’s context window</text><text x="730" y="473">the attacker controls the content</text>
<text x="30" y="503">scheduler nondeterminism</text><text x="370" y="503">agent thinking time δ</text><text x="730" y="503">the attacker can predict the gap</text>
<text x="30" y="533">critical section</text><text x="370" y="533">read → decide → act</text><text x="730" y="533">the action can move money or data</text>
<text x="30" y="563">lock or mutex</text><text x="370" y="563">provenance and hash-pinning</text><text x="730" y="563">checks add latency; locks are cheap</text>
<text x="30" y="593">fix: serialize access</text><text x="370" y="593">fix: verify, then confirm before use</text><text x="730" y="593">policy is needed; no scheduler can fix it</text>
</g>
<g stroke="#eee"><line x1="20" y1="450" x2="1080" y2="450"/><line x1="20" y1="480" x2="1080" y2="480"/><line x1="20" y1="510" x2="1080" y2="510"/><line x1="20" y1="540" x2="1080" y2="540"/><line x1="20" y1="570" x2="1080" y2="570"/></g>
</svg>
