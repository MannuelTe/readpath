<text x="62" y="84.0" text-anchor="end" fill="#52514e">100%</text>
<text x="70.0" y="420" text-anchor="middle" fill="#52514e">1</text>
<text x="190.0" y="420" text-anchor="middle" fill="#52514e">2</text>
<text x="310.0" y="420" text-anchor="middle" fill="#52514e">3</text>
<text x="430.0" y="420" text-anchor="middle" fill="#52514e">4</text>
<text x="550.0" y="420" text-anchor="middle" fill="#52514e">5</text>
<text x="670.0" y="420" text-anchor="middle" fill="#52514e">6</text>
<line x1="70" x2="670" y1="400" y2="400" stroke="#52514e"/>
<text x="370.0" y="446" text-anchor="middle" fill="#52514e">rank r of the fabricator in the agent's source order</text>
<text x="18" y="240.0" text-anchor="middle" fill="#52514e" transform="rotate(-90 18 240.0)">P(fabricator is the source used)</text>
