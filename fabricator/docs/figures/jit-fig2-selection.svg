<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="900" height="470" fill="#fcfcfb"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#0b0b0b">Figure 2 - The harder the question, the more likely the fabricator is the source used</text>
<text x="20" y="48" fill="#52514e">P(agent settles on the fabricator ranked r-th) = (1 - a)^(r-1), where a = chance an honest source answers. The fabricator answers with probability 1.</text>
<line x1="70" x2="670" y1="400.0" y2="400.0" stroke="#e6e5e0"/>
<text x="62" y="404.0" text-anchor="end" fill="#52514e">0%</text>
