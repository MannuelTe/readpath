<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker>
<pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="2"/></pattern></defs>
<rect width="1100" height="560" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#111">Figure 1 — The read-path race: prediction finishes before the agent’s next call</text>
<text x="20" y="48" fill="#555">Time moves from left to right. The attacker wins by being ready at t3, not by being correct.</text>
<!-- lane labels -->
<g font-weight="bold" fill="#111"><text x="20" y="108">Agent</text><text x="20" y="123" font-weight="normal" fill="#555">(slower LLM)</text>
<text x="20" y="208">Attacker server</text><text x="20" y="223" font-weight="normal" fill="#555">(fast predictor)</text>
<text x="20" y="308">Artifact cache</text>
<text x="20" y="398">Honest source</text><text x="20" y="413" font-weight="normal" fill="#555">(generates on demand)</text>
<text x="20" y="488">Verification</text></g>
<g stroke="#e3e3e3"><line x1="150" y1="70" x2="150" y2="510"/><line x1="300" y1="70" x2="300" y2="510"/><line x1="420" y1="70" x2="420" y2="510"/><line x1="600" y1="70" x2="600" y2="510"/><line x1="760" y1="70" x2="760" y2="510"/><line x1="940" y1="70" x2="940" y2="510"/></g>
<!-- agent lane -->
<rect x="150" y="90" width="150" height="40" rx="6" fill="#dbe8fb" stroke="#3b6fc4"/><text x="225" y="115" text-anchor="middle">calls find_providers</text>
<rect x="300" y="90" width="300" height="40" fill="url(#h)" stroke="#ccc"/><text x="450" y="115" text-anchor="middle" fill="#444" >thinking time δ (agent generates)</text>
<rect x="600" y="90" width="120" height="40" rx="6" fill="#dbe8fb" stroke="#3b6fc4"/><text x="660" y="115" text-anchor="middle">calls read_skill</text>
<rect x="720" y="90" width="220" height="40" rx="6" fill="#f8d6d6" stroke="#c0392b"/><text x="830" y="115" text-anchor="middle">accepts and uses the content</text>
<!-- attacker lane -->
<rect x="165" y="190" width="125" height="40" rx="6" fill="#fde9c8" stroke="#d68910"/><text x="227" y="207" text-anchor="middle">bait matches:</text><text x="227" y="222" text-anchor="middle">predict next step</text>
<rect x="300" y="190" width="120" height="40" rx="6" fill="#fde9c8" stroke="#d68910"/><text x="360" y="207" text-anchor="middle">generate the</text><text x="360" y="222" text-anchor="middle">artifact early</text>
<!-- cache lane -->
<rect x="420" y="290" width="180" height="40" rx="6" fill="#d5f0dd" stroke="#1e8449"/><text x="510" y="315" text-anchor="middle">ready and waiting in cache</text>
<rect x="600" y="290" width="120" height="40" rx="6" fill="#d5f0dd" stroke="#1e8449"/><text x="660" y="315" text-anchor="middle">served in ≈0 ms</text>
<!-- honest lane -->
<rect x="600" y="380" width="260" height="40" rx="6" fill="#eee" stroke="#999" stroke-dasharray="4"/><text x="730" y="405" text-anchor="middle" fill="#666">on-demand generation arrives late</text>
<text x="880" y="405" fill="#c0392b" font-weight="bold">× loses the race</text>
<!-- verification lane -->
<rect x="600" y="470" width="190" height="34" rx="6" fill="#fff" stroke="#c0392b" stroke-dasharray="5"/><text x="695" y="492" text-anchor="middle" fill="#c0392b">provenance check skipped</text>
<text x="805" y="492" fill="#555">it adds latency and loses the race</text>
<!-- arrows -->
<path d="M225 130 L225 190" stroke="#333" marker-end="url(#a)"/>
<path d="M420 230 L420 290" stroke="#333" marker-end="url(#a)"/>
<path d="M660 290 L660 240 L660 130" stroke="#333" fill="none" marker-end="url(#a)"/>
<!-- race window bracket -->
<path d="M420 262 L600 262" stroke="#1e8449" stroke-width="2" marker-end="url(#a)"/>
<text x="510" y="256" text-anchor="middle" fill="#1e8449" font-weight="bold">race window</text>
<!-- axis -->
<line x1="150" y1="525" x2="960" y2="525" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
<g text-anchor="middle" fill="#111" font-weight="bold"><text x="150" y="546">t0</text><text x="300" y="546">t1</text><text x="420" y="546">t2</text><text x="600" y="546">t3</text><text x="760" y="546">t4</text><text x="940" y="546">t5</text></g>
<g fill="#555" font-size="11" text-anchor="middle"><text x="150" y="558" dx="0"> </text></g>
<text x="975" y="530" fill="#111">time</text>
<text x="420" y="70" text-anchor="middle" fill="#1e8449" font-weight="bold" font-size="12">t2 &lt; t3: the attacker is ready before the agent asks</text>
</svg>
